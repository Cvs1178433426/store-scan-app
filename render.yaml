services:
  - type: web
    name: continuixai-ops-api
    runtime: docker
    branch: continuixai-ops-completion
    dockerfilePath: ./apps/api/Dockerfile
    dockerCommand: sh -c "npx prisma migrate deploy --config apps/api/prisma.config.ts && node apps/api/dist/index.js"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: continuixai-ops-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: MFA_ENCRYPTION_KEY
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: APP_PUBLIC_URL
        sync: false
      - key: UPCITEMDB_API_KEY
        sync: false
      - key: COOKIE_SECURE
        value: "true"

  - type: web
    name: continuixai-ops-web
    runtime: docker
    branch: continuixai-ops-completion
    dockerfilePath: ./apps/web/Dockerfile
    envVars:
      - key: API_INTERNAL_URL
        fromService:
          type: web
          name: continuixai-ops-api
          property: hostport
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

databases:
  - name: continuixai-ops-db
    plan: free
    postgresMajorVersion: "17"
