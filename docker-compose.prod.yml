services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-continuixai_ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-continuixai_ops}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-continuixai_ops}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/${GH_REPOSITORY_OWNER:-Cvs1178433426}/continuixai-ops-api:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -lc "npx prisma migrate deploy --schema apps/api/prisma/schema.prisma --config apps/api/prisma.config.ts && node apps/api/dist/index.js"
    volumes:
      - uploads:/app/uploads
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-continuixai_ops}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-continuixai_ops}
      JWT_SECRET: ${JWT_SECRET}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY}
      NODE_ENV: production
      PORT: "8080"
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost}
      UPCITEMDB_API_KEY: ${UPCITEMDB_API_KEY:-}
      INVENTORY_WEBHOOK_URL: ${INVENTORY_WEBHOOK_URL:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      SMS_MFA_ENABLED: ${SMS_MFA_ENABLED:-false}
      SMS_GLOBAL_SEND_LIMIT_PER_MINUTE: ${SMS_GLOBAL_SEND_LIMIT_PER_MINUTE:-100}
      SMS_MFA_MIGRATION_DEADLINE: ${SMS_MFA_MIGRATION_DEADLINE:-}
      SMS_MFA_BOOTSTRAP_ADMIN_EMAIL: ${SMS_MFA_BOOTSTRAP_ADMIN_EMAIL:-}
      SMS_MFA_BOOTSTRAP_ADMIN_PHONE: ${SMS_MFA_BOOTSTRAP_ADMIN_PHONE:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_API_KEY_SID: ${TWILIO_API_KEY_SID:-}
      TWILIO_VERIFY_API_KEY_TYPE: ${TWILIO_VERIFY_API_KEY_TYPE:-}
      TWILIO_API_KEY_SECRET: ${TWILIO_API_KEY_SECRET:-}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:-}
      TWILIO_NOTIFICATION_API_KEY_SID: ${TWILIO_NOTIFICATION_API_KEY_SID:-}
      TWILIO_NOTIFICATION_API_KEY_TYPE: ${TWILIO_NOTIFICATION_API_KEY_TYPE:-}
      TWILIO_NOTIFICATION_API_KEY_SECRET: ${TWILIO_NOTIFICATION_API_KEY_SECRET:-}
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
      SENDGRID_RECOVERY_API_KEY: ${SENDGRID_RECOVERY_API_KEY:-}
      MFA_RECOVERY_FROM_EMAIL: ${MFA_RECOVERY_FROM_EMAIL:-}
      MFA_RECOVERY_PUBLIC_URL: ${MFA_RECOVERY_PUBLIC_URL:-}
      EMAIL_OTP_HMAC_KEY: ${EMAIL_OTP_HMAC_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_EXPECTED_HOSTNAME: ${TURNSTILE_EXPECTED_HOSTNAME:-}
      PHONE_ENCRYPTION_KEYS: ${PHONE_ENCRYPTION_KEYS:-}
      PHONE_LOOKUP_HMAC_KEYS: ${PHONE_LOOKUP_HMAC_KEYS:-}
      RATE_LIMIT_HMAC_KEY: ${RATE_LIMIT_HMAC_KEY:-}

  web:
    image: ghcr.io/${GH_REPOSITORY_OWNER:-Cvs1178433426}/continuixai-ops-web:latest
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - api
      - web

volumes:
  pgdata:
  uploads:
